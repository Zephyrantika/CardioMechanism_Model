[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phenotype-network-v0"
version = "0.1.0"
description = "Leakage-aware phenotype-driven disease gene prioritization baseline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy",
  "PyYAML",
]

[project.optional-dependencies]
data = [
  "pandas",
  "pyarrow",
  "pronto",
  "tqdm",
]
graph = [
  "scipy",
  "scikit-learn",
  "networkx",
  "python-igraph",
  "leidenalg",
  "statsmodels",
]
dev = [
  "pytest",
  "pytest-cov",
]
all = [
  "pandas",
  "pyarrow",
  "pronto",
  "tqdm",
  "scipy",
  "scikit-learn",
  "networkx",
  "python-igraph",
  "leidenalg",
  "statsmodels",
]

[tool.hatch.build.targets.wheel]
packages = ["src/phenotype_network_v0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
