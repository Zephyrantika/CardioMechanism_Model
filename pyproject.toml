[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phenotype-network-v0"
version = "0.1.0"
description = "Leakage-aware phenotype-driven disease gene prioritization baseline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy",
  "PyYAML",
]

[project.optional-dependencies]
data = [
  "pandas",
  "pyarrow",
  "pronto",
  "tqdm",
]
graph = [
  "scipy",
  "scikit-learn",
  "networkx",
  "python-igraph",
  "leidenalg",
  "statsmodels",
]
dev = [
  "pytest",
  "pytest-cov",
]
# V1 deep-learning stack. Install torch first from the official CUDA index
# (see requirements-v1-lock-linux.txt); this group only declares PyG pieces
# so CPU-only environments stay installable without CUDA wheels.
deep = [
  "torch_geometric>=2.8,<2.9",
  "pyg-lib>=0.7,<0.8",
]
all = [
  "pandas",
  "pyarrow",
  "pronto",
  "tqdm",
  "scipy",
  "scikit-learn",
  "networkx",
  "python-igraph",
  "leidenalg",
  "statsmodels",
]

[tool.hatch.build.targets.wheel]
packages = ["src/phenotype_network_v0", "src/phenotype_network_v1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
markers = [
  "gpu: GPU integration tests; skipped automatically when CUDA is absent",
]
